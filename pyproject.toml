[build-system]
requires = ["hatchling>=1.27", "editables>=0.3"]
build-backend = "hatchling.build"

[project]
name = "bai-agent"
version = "0.1.0"
description = "跨启动维护连续记忆的可扩展聊天 Agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "filelock>=3.18,<4",
  "openai>=1.97,<3",
  "pydantic>=2.11,<3",
  "rich>=14.2,<16",
  "ruamel.yaml>=0.18,<0.19",
  "textual>=8.2,<9",
  "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27",
  "editables>=0.3",
  "hypothesis>=6.135,<7",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "respx>=0.22,<0.23",
]

[project.scripts]
bai-agent = "bai_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bai_agent"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "bai_agent/default_config"

[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "performance: Linux 强制性能门禁或 Windows 次要参考验收",
  "provider_smoke: 需要显式外部 Provider 凭据的隔离冒烟测试",
]
