name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_prompt_tui_performance:
        description: Run the Ubuntu 24.04/Python 3.13 prompt TUI p95 gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ubuntu-primary:
    name: Ubuntu 24.04 primary / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      # [2026-07-20] 原生 Ubuntu 24.04 是主要功能矩阵；完整历史供凭据扫描使用。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify module entry
        run: python -m bai_agent --help
      - name: Run cross-platform functional suite
        run: pytest -m "not performance"

  windows-secondary:
    name: Windows secondary / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      # [2026-07-20] Windows 只承担次要功能兼容，不执行 500ms 强制性能门禁。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify module entry
        run: python -m bai_agent --help
      - name: Run secondary functional suite
        run: pytest -m "not performance"

  prompt-tui-reference-performance:
    name: Ubuntu 24.04 / Python 3.13 prompt TUI performance
    if: github.event_name == 'workflow_dispatch' && inputs.run_prompt_tui_performance
    runs-on: ubuntu-24.04
    env:
      TERM: xterm-256color
      COLUMNS: '80'
      LINES: '24'
    steps:
      # [2026-07-20] 冷启动单独记录；门禁只计算随后 30 次同进程 mounted p95。
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run 30-launch prompt TUI p95 gate
        run: pytest tests/performance/test_prompt_tui_latency.py -q -s
